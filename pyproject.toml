[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvn-cli"
version = "0.1.0"
description = "rvn — the Riven CLI: grounded chat with citations, deep research, and Pages over the Riven gateway"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Riven", email = "fable@rivenai.io" }]
keywords = ["riven", "cli", "ai", "grounded-search", "citations"]

[project.scripts]
rvn = "rvn.cli:run"

[project.urls]
Homepage = "https://rivenai.io"
Documentation = "https://docs.rivenai.io"
Repository = "https://github.com/rivenai/rvn-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
